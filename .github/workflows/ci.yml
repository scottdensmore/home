name: Validate badge files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: badge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Badge source and asset integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show existing host checker runtime
        run: python3 --version
      - name: Test the static checker with synthetic inputs
        run: python3 -I -m unittest discover -s tests -v
      - name: Parse sources and verify assets without executing badge code
        run: python3 -I scripts/check_badge_files.py
      - name: Verify tracked source and assets were preserved
        run: git diff --quiet --exit-code
